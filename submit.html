<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>投递作品 · 比特海盗的码头</title><link rel="stylesheet" href="assets/styles.css"></head>
<body data-page="submit"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">⌁</span>比特海盗的码头</a><nav><a href="index.html#works">所有作品</a></nav></header><main class="form-page"><div class="form-intro"><p class="eyebrow">CAST OFF</p><h1>把作品<br><em>投到码头。</em></h1><p>不需要完美。写下它从哪儿出发、怎么做出来的，剩下的交给船长审核。</p><p class="form-note">作品审核通过后公开展示；作者信息会为你记住。</p></div><form id="submit-form" class="work-form"><label>作品名称<input required maxlength="60" name="title" placeholder="例如：会写故事的像素海图"></label><label>一句话简介<input required maxlength="120" name="description" placeholder="它解决什么，或带来了什么有趣体验？"></label><div class="form-row"><label>作者昵称<input required maxlength="30" name="author_name" autocomplete="nickname"></label><label>你在船上的角色<select required name="author_role" id="author-role"></select></label></div><label>封面图 <span class="muted">JPG / PNG / WEBP，最大 5MB</span><input required accept="image/jpeg,image/png,image/webp" name="cover" type="file"></label><label>作品链接 <span class="muted">可选</span><input name="link" type="url" placeholder="https://"></label><label>航程录<textarea required maxlength="3000" name="journey_log" rows="7" placeholder="讲讲你从灵感到做出来的过程；用到了什么 AI，踩了什么坑？"></textarea></label><button class="button" type="submit">投递，等待靠岸 <span>→</span></button><p id="form-message" class="form-message" role="status"></p></form></main><footer><span>比特海盗的码头</span><span class="mono">MAKE · SHIP · SHARE</span></footer><script type="module" src="assets/app.js"></script></body></html>
